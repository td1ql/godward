name: 构建发布包

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  build:
    name: 导出 Windows + Android
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ---------- 工具链 ----------
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 使用预装的 Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: 检查 Android 构建工具（不安装，用预装的）
        run: |
          echo "预装的 build-tools："
          ls -1 "$ANDROID_HOME/build-tools" || true
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          echo "使用：$BT"
          "$BT/apksigner" --version || true
          "$BT/zipalign" 2>&1 | head -3 || true

      - name: 下载 Godot
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: 下载导出模板
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" -d /tmp/tpl
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | head -20

      # ---------- Godot 编辑器设置（SDK 路径 / 调试密钥）----------
      - name: 配置 Godot 的 Android 环境
        run: |
          set -e
          CFG="$HOME/.config/godot"
          mkdir -p "$CFG"
          # Godot 4.x 的编辑器设置文件可能叫 editor_settings-4.tres，也可能是带小版本号的
          SETTINGS="$CFG/editor_settings-4.tres"
          touch "$SETTINGS"
          # 生成一个调试密钥库
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore "$HOME/.android/debug.keystore" \
              -storepass android -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12 -storetype pkcs12
          fi
          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/force_system_user = false
          EOF
          cp "$SETTINGS" "$CFG/editor_settings-4.7.tres" || true
          echo "--- settings ---"
          cat "$SETTINGS"

      - name: 导入资源
        run: |
          godot --headless --path . --import || godot --headless --path . --quit

      # ---------- 导出 ----------
      - name: 导出 Windows（单文件 exe）
        run: |
          set -e
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/Godward.exe
          ls -lh build

      - name: 导出 Android（APK）
        continue-on-error: true
        run: |
          mkdir -p build
          set +e
          godot --headless --path . --export-release "Android" build/Godward.apk 2>&1 | tee /tmp/android_export.log
          CODE=${PIPESTATUS[0]}
          echo "退出码: $CODE"
          {
            echo "## Android 导出结果"
            echo "退出码: $CODE"
            echo "### 日志尾部"
            echo '```'
            tail -40 /tmp/android_export.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh build
          exit 0

      - name: 给 APK 对齐并签名
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          KS="$HOME/.android/debug.keystore"
          if [ ! -f "$KS" ]; then
            mkdir -p "$HOME/.android"
            keytool -keyalg RSA -genkeypair -alias androiddebugkey               -keypass android -keystore "$KS"               -storepass android -dname "CN=Android Debug,O=Android,C=US"               -validity 9999 -storetype pkcs12
          fi
          if [ ! -f build/Godward.apk ]; then
            echo "::error::导出没有产出 APK"
            exit 1
          fi
          # 先对齐（v2 签名要求）
          "$BT/zipalign" -f -p 4 build/Godward.apk build/Godward-aligned.apk
          # 再签名（v1 + v2 + v3）
          "$BT/apksigner" sign             --ks "$KS" --ks-pass pass:android --key-pass pass:android             --ks-key-alias androiddebugkey             --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true             --out build/Godward-signed.apk build/Godward-aligned.apk
          mv build/Godward-signed.apk build/Godward.apk
          rm -f build/Godward-aligned.apk
          # 验证
          "$BT/apksigner" verify --verbose build/Godward.apk
          echo "--- META-INF ---"
          unzip -l build/Godward.apk | grep -i "META-INF" || echo "（没有 META-INF！）"
          ls -lh build

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godward-build
          path: build/
          if-no-files-found: error

      - name: 附加到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Godward.exe
            build/Godward.apk
          generate_release_notes: true

  # ============================================================
  # Web 版：给 iPhone / 平板 / 随便谁一个链接就能玩
  # ============================================================
  export-web:
    name: 导出 Web 版
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 下载 Godot
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: 下载导出模板
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" -d /tmp/tpl
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | grep -i web || true

      - name: 导入资源
        run: godot --headless --path . --import || godot --headless --path . --quit

      - name: 导出 Web
        run: |
          set -e
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -lh build/web
          echo "--- 体积 ---"
          du -sh build/web

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    name: 发布到 GitHub Pages
    needs: export-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 启用 / 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
