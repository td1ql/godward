name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.2"
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --import

      - name: Export Windows
        run: |
          mkdir -p build
          godot --headless --export-release "Windows Desktop" "build/SlayTheTower.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlayTheTower-Windows
          path: build/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
